<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Behavior Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        .sidebar { background-color: #1e293b; height: 100vh; border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
        .sidebar-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .upload-area { border: 2px dashed #475569; border-radius: 10px; padding: 30px 10px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px; background-color: #0f172a; }
        .upload-area:hover { border-color: #3b82f6; background-color: #1e293b; }
        .btn-control { width: 100%; margin-bottom: 10px; font-weight: 600; padding: 10px; border-radius: 8px; border: none; }
        .btn-start { background-color: #22c55e; color: white; }
        .btn-stop { background-color: #ef4444; color: white; }
        .settings-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .settings-header { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .form-label-sm { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 2px; }
        .form-control-sm, .form-range { accent-color: #3b82f6; }
        .main-content { height: 100vh; padding: 0; display: flex; justify-content: center; align-items: center; background-color: #000; position: relative; }
        #videoDisplay { max-width: 100%; max-height: 100%; object-fit: contain; }
        .placeholder-text { position: absolute; color: #64748b; text-align: center; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="sidebar-title"><i class="fa-solid fa-cart-shopping"></i> Behavior AI</div>

            <div class="upload-area" id="dropArea">
                <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2 text-primary"></i>
                <div class="upload-text">Upload Video</div>
                <input type="file" id="videoInput" accept="video/*" hidden>
            </div>
            <div id="uploadStatus" class="text-center mb-3 text-success small" style="display:none;">
                <i class="fa-solid fa-check-circle"></i> <span id="fileName"></span>
            </div>

            <button class="btn btn-control btn-start" id="btnStart" disabled><i class="fa-solid fa-play"></i> Start Tracking</button>
            <button class="btn btn-control btn-stop" id="btnStop" disabled><i class="fa-solid fa-stop"></i> Finish Tracking</button>

            <hr class="border-secondary">

            <form id="settingsForm">
                <div class="settings-card">
                    <div class="settings-header">
                        <span>YOLO Pose (Human)</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="model_pose_enabled" checked>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                        <label class="form-label-sm">Confidence: <span id="val_pose">{{ defaults.pose_conf }}</span></label>
                        <input type="range" class="form-range" id="pose_conf_thresh" min="0.1" max="1.0" step="0.05" value="{{ defaults.pose_conf }}" oninput="document.getElementById('val_pose').innerText=this.value">
                    </div>
                    
                    <div class="row g-2 mb-2">
                         <div class="col-6">
                            <label class="form-label-sm">Skip Frames</label>
                            <input type="number" class="form-control form-control-sm" id="pose_skip_frames" value="{{ defaults.pose_skip }}" min="1">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-2">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="keypoint_draw" checked>
                            <label class="form-check-label form-label-sm">Skeleton</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="draw_grid_enabled">
                            <label class="form-check-label form-label-sm">Grid</label>
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <div class="settings-header">
                        <span>Object365 (Items)</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="model_object_enabled" checked>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                         <label class="form-label-sm">Confidence: <span id="val_obj">{{ defaults.object_conf }}</span></label>
                        <input type="range" class="form-range" id="object_conf_thresh" min="0.1" max="1.0" step="0.05" value="{{ defaults.object_conf }}" oninput="document.getElementById('val_obj').innerText=this.value">
                    </div>
                    
                     <div class="row g-2 mb-2">
                         <div class="col-6">
                            <label class="form-label-sm">Skip Frames</label>
                             <input type="number" class="form-control form-control-sm" id="object_skip_frames" value="{{ defaults.object_skip }}" min="1">
                        </div>
                    </div>

                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="objects_draw" checked>
                        <label class="form-check-label form-label-sm">Draw Object Box</label>
                    </div>
                </div>

                <div class="settings-card">
                    <div class="settings-header">
                        <span>Risk Model (Theft)</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="model_risk_enabled" checked>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                         <label class="form-label-sm">Confidence: <span id="val_risk">{{ defaults.risk_conf }}</span></label>
                        <input type="range" class="form-range" id="risk_conf_thresh" min="0.1" max="1.0" step="0.05" value="{{ defaults.risk_conf }}" oninput="document.getElementById('val_risk').innerText=this.value">
                    </div>

                     <div class="row g-2 mb-2">
                         <div class="col-6">
                            <label class="form-label-sm">Skip Frames</label>
                             <input type="number" class="form-control form-control-sm" id="risk_skip_frames" value="{{ defaults.risk_skip }}" min="1">
                        </div>
                    </div>

                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="risk_draw_bbox" checked>
                        <label class="form-check-label form-label-sm">Draw Risk Box</label>
                    </div>
                </div>
            </form>
        </div>

        <div class="col-md-9 col-lg-10 main-content">
            <div class="placeholder-text" id="placeholder">
                <i class="fa-solid fa-video fa-3x mb-3"></i><br>
                Video Output Area<br>
                Upload & Start to view
            </div>
            <img id="videoDisplay" src="" style="display:none;" alt="Processed Video Stream">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dropArea = document.getElementById('dropArea');
    const videoInput = document.getElementById('videoInput');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const videoDisplay = document.getElementById('videoDisplay');
    const placeholder = document.getElementById('placeholder');
    const uploadStatus = document.getElementById('uploadStatus');
    const fileNameDisplay = document.getElementById('fileName');

    let isTracking = false;

    dropArea.addEventListener('click', () => videoInput.click());
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.style.borderColor = '#3b82f6'; });
    dropArea.addEventListener('dragleave', () => { dropArea.style.borderColor = '#475569'; });
    dropArea.addEventListener('drop', (e) => { e.preventDefault(); dropArea.style.borderColor = '#475569'; if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files[0]); });
    videoInput.addEventListener('change', () => { if(videoInput.files.length) handleFiles(videoInput.files[0]); });

    function handleFiles(file) {
        const formData = new FormData(); formData.append('video', file);
        dropArea.innerHTML = '<div class="spinner-border text-primary" role="status"></div><div class="mt-2">Uploading...</div>';
        fetch('/upload', { method: 'POST', body: formData }).then(r=>r.json()).then(data => {
            dropArea.innerHTML = '<i class="fa-solid fa-cloud-arrow-up fa-2x mb-2 text-primary"></i><div class="upload-text">Change Video</div>';
            if (data.success) {
                uploadStatus.style.display = 'block'; fileNameDisplay.innerText = data.filename; btnStart.disabled = false;
            } else alert(data.message);
        }).catch(e => { console.error(e); dropArea.innerHTML = 'Error Uploading'; });
    }

    function getSettings() {
        return {
            pose_conf_thresh: parseFloat(document.getElementById('pose_conf_thresh').value),
            pose_skip_frames: parseInt(document.getElementById('pose_skip_frames').value),
            model_pose_enabled: document.getElementById('model_pose_enabled').checked,
            keypoint_draw: document.getElementById('keypoint_draw').checked,
            draw_grid: document.getElementById('draw_grid_enabled').checked,

            object_conf_thresh: parseFloat(document.getElementById('object_conf_thresh').value),
            object_skip_frames: parseInt(document.getElementById('object_skip_frames').value),
            model_object_enabled: document.getElementById('model_object_enabled').checked,
            objects_draw: document.getElementById('objects_draw').checked,

            risk_conf_thresh: parseFloat(document.getElementById('risk_conf_thresh').value),
            risk_skip_frames: parseInt(document.getElementById('risk_skip_frames').value),
            model_risk_enabled: document.getElementById('model_risk_enabled').checked,
            risk_draw_bbox: document.getElementById('risk_draw_bbox').checked
        };
    }

    btnStart.addEventListener('click', () => {
        const settings = getSettings();
        fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', settings: settings }) })
        .then(res => res.json()).then(data => {
            if (data.success) {
                isTracking = true; btnStart.disabled = true; btnStop.disabled = false;
                placeholder.style.display = 'none'; videoDisplay.style.display = 'block';
                videoDisplay.src = "/video_feed?t=" + new Date().getTime();
            } else alert(data.message);
        });
    });

    btnStop.addEventListener('click', () => {
        fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'reset' }) })
        .then(res => res.json()).then(data => {
            if (data.success) {
                isTracking = false; btnStart.disabled = false; btnStop.disabled = true;
                videoDisplay.src = ""; videoDisplay.style.display = 'none'; placeholder.style.display = 'block';
                placeholder.innerHTML = '<i class="fa-solid fa-check fa-3x mb-3 text-success"></i><br>Tracking Finished';
            }
        });
    });
</script>
</body>
</html>
